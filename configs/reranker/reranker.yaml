data_type: 'LaMP2'
model_name: 'BAAI/bge-base-en-v1.5'
cut_his_len: 128
seed: 42
num_facets: 7
mof_top_k: 3
inference:
  type: 'reranker'
  train: 
    data_path: '/data/reranker/train.json'
    input_file_path: '/data/inputs/reranker_train.jsonl'
    output_file_path: '/data/outputs/reranker_train.jsonl'
  fit:
    data_path: '/data/reranker/fit_history.json'
    input_file_path: '/data/inputs/reranker_fit_history.jsonl'
    output_file_path: '/data/outputs/reranker_fit_history.jsonl'
  eval:
    num_items: 4
    data_path: '/data/predicts/mof_reranker_'
    input_file_path: '/data/inputs/reranker_eval_'
    output_file_path: '/data/outputs/reranker_eval_'
trainer:
  user_embs_path: '/data/user_embs_train.pt'
  output_dir: '/checkpoints/mof_reranker_train_v'
  learning_rate: 5.0e-5
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  weight_decay: 0.01
  logging_steps: 10
  logging_strategy: 'steps'
  # save_strategy: epoch
  save_strategy: 'no'
  push_to_hub: False
fit:
  user_embs_path: '/data/user_embs_test.pt'
  output_dir: '/checkpoints/mof_reranker_fit_v'
  learning_rate: 5.0e-5
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 2
  weight_decay: 0.01
  logging_steps: 10
  logging_strategy: 'steps'
  # save_strategy: epoch
  save_strategy: 'no'
  push_to_hub: False
eval:
  data_path: '/data/reranker/eval.json'
  save_path: '/data/predicts/mof_reranker_'
  user_embs_path: '/data/user_embs_test.pt'
  batch_size: 128