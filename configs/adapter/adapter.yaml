data_type: 'LaMP2'
model_name: 'BAAI/bge-base-en-v1.5'
random_query_num: 10000000
cluster_num: 10
cut_his_len: 128
num_facets: 7
mof_top_k: 3
seed: 42
origin:
  train:
    data_path: '/data/lamp/LaMP2_train.json'
  test:
    data_path: '/data/lamp/LaMP2_test.json'
inference:
  type: 'adapter'
  train: 
    data_path: '/data/adapter/train.json'
    input_file_path: '/data/inputs/adapter_train.jsonl'
    output_file_path: '/data/outputs/adapter_train.jsonl'
  fit:
    data_path: '/data/adapter/fit_history.json'
    input_file_path: '/data/inputs/adapter_fit_history.jsonl'
    output_file_path: '/data/outputs/adapter_fit_history.jsonl'
  eval:
    data_path: '/data/adapter/eval.json'
    input_file_path: '/data/inputs/adapter_eval.jsonl'
    output_file_path: '/data/outputs/adapter_eval.jsonl'
trainer:
  user_embs_path: '/data/user_embs_train.pt'
  output_dir: '/checkpoints/mof_adapter_train_v'
  learning_rate: 5.0e-5
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  weight_decay: 0.01
  logging_steps: 10
  logging_strategy: 'steps'
  # save_strategy: epoch
  save_strategy: 'no'
  push_to_hub: False
fit:
  user_embs_path: '/data/user_embs_test.pt'
  output_dir: '/checkpoints/mof_adapter_fit_v'
  learning_rate: 5.0e-5
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 2
  weight_decay: 0.01
  logging_steps: 10
  logging_strategy: 'steps'
  # save_strategy: epoch
  save_strategy: 'no'
  push_to_hub: False
eval:
  save_path: '/data/predicts/mof_adapter_'
  user_embs_path: '/data/user_embs_test.pt'
  batch_size: 128